# Deep Groove Worker.
#
# No sign-in for v1 (OPEN-USERS-ACCESS, 2026-08-30), so the SHAPE of
# this Worker carries the safety: it exposes named operations only and
# has no general Discogs proxy. DISCOGS_TOKEN is a secret set with
# `wrangler secret put DISCOGS_TOKEN` — never in this file, never in
# the repo. In M1 no route reads it at all; a test enforces that.

name = "deep-groove"
main = "worker/index.ts"
compatibility_date = "2026-08-01"

# The client is served BY the Worker, not from a separate Pages project.
# One origin means the app's /api calls are same-origin, so there is no
# CORS to configure and no second deploy to keep in step. Cloudflare now
# recommends this over Pages, and its own error says so.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"

[[d1_databases]]
binding = "DB"
database_name = "deep-groove"
database_id = "59862adc-60d8-4207-98e3-c6e9ae55eefd"

# R2 must be enabled once in the Cloudflare dashboard before the API
# will accept it — `wrangler r2 bucket create` answers "Please enable R2
# through the Cloudflare Dashboard [code: 10042]" until then, and there
# is no API route around it. The Worker treats PHOTOS as optional so it
# can deploy without it; label photos queue on the phone until this is
# uncommented and `bash tools/deploy.sh` is run again.
# [[r2_buckets]]
# binding = "PHOTOS"
# bucket_name = "deep-groove-photos"

# API response cache, keyed by normalised query. Unused until M2.
[[kv_namespaces]]
binding = "CACHE"
id = "3f62537511354c4fad11caba49fd2235"

# The matcher runs from cron, never from a route. With no sign-in, an
# HTTP trigger would be a stranger's lever on the Discogs rate limit;
# a schedule has no caller at all (M2-MATCHER, OPEN-USERS-ACCESS).
[triggers]
crons = ["*/5 * * * *"]

# A tick is four rows of JSON parsing and scoring — milliseconds of CPU,
# with the rest of its wall time spent waiting on the two-second Discogs
# spacing, which costs no CPU. The 30s default is therefore 30s of room
# a runaway loop could use; 10s is still ~100x what a healthy tick needs
# and turns "spins until the platform stops it" into "dies quickly and
# visibly". Cloudflare sells no hard spend cap, so ceilings are ours to
# build (OPS-SPEND-GUARD).
[limits]
cpu_ms = 10000

[observability]
enabled = true
