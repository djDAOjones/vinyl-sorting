# Vinyl sorter Worker.
#
# No sign-in for v1 (OPEN-USERS-ACCESS, 2026-08-30), so the SHAPE of
# this Worker carries the safety: it exposes named operations only and
# has no general Discogs proxy. DISCOGS_TOKEN is a secret set with
# `wrangler secret put DISCOGS_TOKEN` — never in this file, never in
# the repo. In M1 no route reads it at all; a test enforces that.

# THE WORKER'S NAME IS THE URL, and it moved on 2026-08-31. The
# product was renamed to Vinyl sorter on 2026-08-30 and the address
# spent a day disagreeing with it; APP-RENAME closed that.
#
# THE DATA DID NOT MOVE, and the file used to claim it would. Bindings
# reference resources, not this script:
#
#   database_id   a UUID. Any Worker binding it gets the same D1, with
#                 all 484 items and their match runs. There is no
#                 rename because there is nothing to rename.
#   bucket_name   an account-level bucket. Same photographs, same keys.
#   kv id         likewise.
#
# So the D1 database, the R2 bucket and the KV namespace all still say
# `deep-groove`. They are identities rather than labels, none of them
# is visible in the app, and renaming them WOULD cost a migration.
# Leave them.
#
# What the rename did cost is the ORIGIN, and that bill was paid once:
# every phone re-added the home-screen icon, re-typed its name into
# localStorage, and re-entered the edit passphrase, because the browser
# scopes all three to the hostname. Anything queued offline on a phone
# at the moment of the cut was at the old origin and unreachable from
# here — which is why the old script was left running until the last
# phone had synced, and only then deleted.
#
# Worker SECRETS are per-script too: DISCOGS_TOKEN and EDIT_TOKEN were
# set again on this name. They did not come across.
name = "vinyl-sorter"
main = "worker/index.ts"
compatibility_date = "2026-08-01"

# The client is served BY the Worker, not from a separate Pages project.
# One origin means the app's /api calls are same-origin, so there is no
# CORS to configure and no second deploy to keep in step. Cloudflare now
# recommends this over Pages, and its own error says so.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"

[[d1_databases]]
binding = "DB"
database_name = "deep-groove"
database_id = "59862adc-60d8-4207-98e3-c6e9ae55eefd"

# Label photos. Attached 2026-08-30 by tools/deploy.sh, which
# uncomments this block once R2 answers — R2 has to be switched on once
# in the dashboard before `wrangler r2 bucket create` will work, and it
# answers "Please enable R2 through the Cloudflare Dashboard
# [code: 10042]" until it is.
#
# Before this existed the Worker had no PHOTOS binding, so every upload
# returned 503 and the app kept the photo queued on the phone — which
# it was right to do, but it meant no photograph had ever left a phone
# and nothing on screen said so. The Worker still treats PHOTOS as
# optional, so removing this degrades to that behaviour rather than
# breaking the deploy.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "deep-groove-photos"

# API response cache, keyed by normalised query. Unused until M2.
[[kv_namespaces]]
binding = "CACHE"
id = "3f62537511354c4fad11caba49fd2235"

# The matcher runs from cron, never from a route. With no sign-in, an
# HTTP trigger would be a stranger's lever on the Discogs rate limit;
# a schedule has no caller at all (M2-MATCHER, OPEN-USERS-ACCESS).
[triggers]
crons = ["*/5 * * * *"]

# NO [limits] BLOCK — deliberately, and do not add one back while this
# account is on the Free plan. Cloudflare rejects the deploy outright:
# "CPU limits are not supported for the Free plan [code: 100328]". It
# was added here on 2026-08-30 and made the Worker undeployable until
# it was removed; a test now guards against re-adding it.
#
# Nothing is lost. Free enforces its own per-invocation CPU cap, and
# the real wall against runaway cost is D1 refusing writes past
# 100k/day rather than billing for them. The per-tick write budget in
# the matcher is the ceiling that does the work (OPS-SPEND-GUARD).
# On a paid plan, re-add cpu_ms and update the guarding test.

[observability]
enabled = true
