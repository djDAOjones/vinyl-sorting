<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- The theme, before paint. Three lines of duplication against a
     flash of the wrong palette on every navigation; `src/chrome.ts`
     is the authority for what they mean. -->
<script>
(function () {
  try {
    var d = document.documentElement, t = localStorage.getItem('vs.theme');
    if ((t === 'light' || (t !== 'dark' && matchMedia('(prefers-color-scheme: light)').matches))
        && !d.hasAttribute('data-force-dark')) d.classList.add('light');
    if (localStorage.getItem('vs.density') === 'dense') d.classList.add('dense');
  } catch (e) { /* dark is the base, which is the safe fallback */ }
})();
</script>
<link rel="stylesheet" href="/src/tokens.css">
<link rel="stylesheet" href="/src/app.css">
<link rel="stylesheet" href="/src/home.css">
</head>
<body>
<main id="home" class="w-wide" aria-live="polite"></main>
<script type="module" src="/src/home.ts"></script>
</body>
</html>
